<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Capacity Connect</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --cd: #fff;
            --fg: #0f1a3a;
            --mu: #5b6789;
            --pr: #3730a3;
            --p2: #4f46e5;
            --bd: #e2e6f2;
            --ok: #15803d;
            --okb: #dcfce7;
            --wa: #b45309;
            --wab: #fef3c7;
            --er: #b91c1c;
            --erb: #fee2e2;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:light) {
            :root:not([data-theme=light]) {
                --bg: #0d1226;
                --cd: #161d38;
                --fg: #e8ecff;
                --mu: #9aa6cc;
                --pr: #a5b4fc;
                --bd: #2a3357;
                --ok: #4ade80;
                --okb: #123524;
                --wa: #fbbf24;
                --wab: #3a2a0b;
                --er: #f87171;
                --erb: #3d1417
            }
        }

        :root[data-theme=dark] {
            --bg: #0d1226;
            --cd: #161d38;
            --fg: #e8ecff;
            --mu: #9aa6cc;
            --pr: #a5b4fc;
            --bd: #2a3357;
            --ok: #4ade80;
            --okb: #123524;
            --wa: #fbbf24;
            --wab: #3a2a0b;
            --er: #f87171;
            --erb: #3d1417
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        #r {
            min-height: 100%
        }

        h1,
        h2,
        h3 {
            margin: .2em 0
        }

        .mu {
            color: var(--mu)
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .sp {
            justify-content: space-between
        }

        .b {
            background: var(--p2);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 9px 16px;
            cursor: pointer;
            font: inherit;
            font-weight: 600
        }

        .b.o {
            background: transparent;
            color: var(--pr);
            border: 1px solid var(--bd)
        }

        .b.s {
            padding: 5px 10px;
            font-size: 13px
        }

        .cd {
            background: var(--cd);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 16px;
            margin: 0 0 14px
        }

        .g {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            margin-bottom: 14px
        }

        .g .cd {
            margin: 0
        }

        .bar {
            height: 9px;
            background: var(--bd);
            border-radius: 9px;
            overflow: hidden;
            flex: 1;
            min-width: 60px
        }

        .bar i {
            display: block;
            height: 100%;
            border-radius: 9px
        }

        .bd {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            background: var(--bd)
        }

        .bd.ok {
            background: var(--okb);
            color: var(--ok)
        }

        .bd.wa {
            background: var(--wab);
            color: var(--wa)
        }

        .bd.er {
            background: var(--erb);
            color: var(--er)
        }

        .cr {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 8px 0
        }

        .cr span {
            width: 130px;
            font-size: 13px
        }

        .cr b {
            width: 52px;
            text-align: right;
            font-size: 13px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--cd);
            border-bottom: 1px solid var(--bd);
            position: relative
        }

        .app {
            display: flex;
            min-height: calc(100vh - 57px)
        }

        .side {
            width: 220px;
            padding: 12px;
            background: var(--cd);
            border-right: 1px solid var(--bd);
            flex: none
        }

        .side a {
            display: block;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--mu)
        }

        .side a.on {
            background: var(--p2);
            color: #fff
        }

        .main {
            flex: 1;
            padding: 20px;
            min-width: 0
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--bd)
        }

        .sc {
            overflow-x: auto
        }

        input,
        select,
        textarea {
            font: inherit;
            padding: 8px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--fg);
            width: 100%;
            margin: 3px 0 8px
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: linear-gradient(135deg, #312e81, #4f46e5);
            color: #fff
        }

        .hero h1 {
            font-size: clamp(30px, 6vw, 52px);
            letter-spacing: 2px
        }

        .land .g {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 16px
        }

        .bell {
            position: relative;
            cursor: pointer;
            font-size: 20px;
            background: none;
            border: 0
        }

        .bell em {
            position: absolute;
            top: -4px;
            right: -6px;
            background: var(--er);
            color: #fff;
            font-size: 11px;
            border-radius: 9px;
            padding: 0 5px;
            font-style: normal
        }

        .pop {
            position: absolute;
            right: 16px;
            top: 54px;
            width: min(340px, 92vw);
            background: var(--cd);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px;
            z-index: 9;
            box-shadow: 0 8px 30px #0003
        }

        .pop p {
            margin: 6px 0;
            font-size: 14px
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #111a3d;
            color: #fff;
            padding: 10px 18px;
            border-radius: 9px;
            z-index: 99
        }

        .hm td {
            text-align: center;
            font-weight: 600
        }

        .step {
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer
        }

        .ar {
            text-align: center;
            color: var(--mu)
        }

        .cert {
            border: 8px double var(--p2);
            padding: 36px;
            text-align: center;
            background: var(--cd);
            border-radius: 6px
        }

        .cert h1 {
            color: var(--pr)
        }

        @media(max-width:760px) {
            .app {
                flex-direction: column
            }

            .side {
                width: 100%;
                display: flex;
                overflow-x: auto;
                border-right: 0;
                border-bottom: 1px solid var(--bd)
            }

            .side a {
                white-space: nowrap
            }

            .cr span {
                width: 90px
            }
        }

        @media print {
            body * {
                visibility: hidden
            }

            .cert,
            .cert * {
                visibility: visible
            }

            .cert {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%
            }
        }
    </style>
</head>

<body>
    <div id="r"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
        const { useState, useEffect } = React;
        const h = (t, p, ...c) => React.createElement(t, p && p.class ? (({ class: k, ...r }) => ({ ...r, className: k }))(p) : p, ...c);
        const html = htm.bind(h);
        const load = () => { try { return JSON.parse(localStorage.getItem('cc1')) } catch (e) { return null } };
        const save = s => { try { localStorage.setItem('cc1', JSON.stringify(s)) } catch (e) { } };
        const TR = [
            { n: 'Dr. Anita Verma', ex: ['Machine Learning', 'Python', 'Data Science'], y: 8, r: 4.8, o: 'IIT Delhi', c: 3 },
            { n: 'Prof. Suresh Iyer', ex: ['Data Science', 'Machine Learning', 'Statistics'], y: 6, r: 4.6, o: 'IISc Bengaluru', c: 2 },
            { n: 'Dr. Meera Nair', ex: ['Python', 'AI', 'Deep Learning'], y: 5, r: 4.4, o: 'C-DAC Pune', c: 2 },
            { n: 'Vikram Singh', ex: ['Cloud Computing', 'DevOps', 'Python'], y: 9, r: 4.7, o: 'NIC Delhi', c: 4 },
            { n: 'Dr. Kavita Rao', ex: ['Research Methodology', 'Statistics', 'Data Analysis'], y: 12, r: 4.9, o: 'ISI Kolkata', c: 3 },
            { n: 'Arjun Mehta', ex: ['Data Visualization', 'Data Analysis'], y: 7, r: 4.5, o: 'NIT Trichy', c: 1 }];
        const REL = { Python: ['Data Science', 'DevOps'], 'Machine Learning': ['Python', 'AI', 'Deep Learning', 'Data Science'], 'Data Analysis': ['Statistics', 'Data Science', 'Data Visualization'], 'Cloud Computing': ['DevOps', 'Python'], 'Data Visualization': ['Data Analysis', 'Python'], 'Research Methodology': ['Statistics', 'Data Analysis'] };
        const match = (t, sk) => Math.round((t.ex.includes(sk) ? 60 : (REL[sk] || []).some(x => t.ex.includes(x)) ? 45 : 5) + Math.min(t.y / 10, 1) * 25 + t.r / 5 * 15);
        const C = [
            ['c1', 'Python for Data Science', 'Python', 'Beginner', 4, 0, 'Core Python, NumPy and pandas for scientific data workflows.'],
            ['c2', 'Machine Learning Basics', 'Machine Learning', 'Beginner', 3, 0, 'Foundations of ML: data, features and simple models.'],
            ['c3', 'Machine Learning Fundamentals', 'Machine Learning', 'Intermediate', 5, 1, 'Supervised and unsupervised learning with hands-on evaluation.'],
            ['c4', 'Applied Machine Learning', 'Machine Learning', 'Advanced', 6, 0, 'Deploying ML models on real organizational datasets.'],
            ['c5', 'Advanced Data Analytics', 'Data Analysis', 'Intermediate', 4, 4, 'Statistical analysis and exploratory analytics at scale.'],
            ['c6', 'Cloud Computing Basics', 'Cloud Computing', 'Intermediate', 3, 3, 'Cloud architecture, storage and secure deployment.'],
            ['c7', 'Research Methodology', 'Research Methodology', 'Intermediate', 4, 4, 'Designing, executing and reporting rigorous research.'],
            ['c8', 'Data Visualization', 'Data Visualization', 'Intermediate', 3, 5, 'Dashboards and visual storytelling with data.']].map(([id, t, sk, df, du, tr, d]) => ({ id, t, sk, df, du, tr, d }));
        const Q = {
            'Machine Learning': [
                ['Which technique is commonly used for supervised learning?', ['Linear Regression', 'Random Search', 'Clustering', 'Association Rules'], 0],
                ['Which metric suits a classification problem?', ['RMSE', 'Accuracy', 'R-squared', 'Silhouette width'], 1],
                ['Overfitting means the model...', ['Performs well on new data', 'Memorises training data', 'Has too few features', 'Trains too fast'], 1],
                ['Which is an unsupervised method?', ['K-Means', 'Logistic Regression', 'Decision Tree', 'SVM'], 0],
                ['Data is usually split into...', ['Train and test sets', 'Rows and columns', 'Input pipes', 'None'], 0]],
            Python: [['Which library provides DataFrames?', ['pandas', 'flask', 'pytest', 'tkinter'], 0], ['Which is a mutable type?', ['tuple', 'str', 'list', 'int'], 2], ['What does len([1,2,3]) return?', ['2', '3', '4', 'Error'], 1]],
            'Data Analysis': [['The median is...', ['The average', 'The middle value', 'The most frequent value', 'The range'], 1], ['An outlier is...', ['A missing value', 'An extreme value', 'A duplicate', 'A category'], 1], ['Correlation measures...', ['Causation', 'Association strength', 'Sample size', 'Bias'], 1]],
            'Cloud Computing': [['IaaS provides...', ['Virtual infrastructure', 'Only email', 'Desktop apps', 'Printers'], 0], ['Elasticity means...', ['Fixed capacity', 'Scaling with demand', 'Data deletion', 'Slow networks'], 1], ['Object storage suits...', ['Unstructured files', 'CPU scheduling', 'Screen rendering', 'Compilers'], 0]],
            'Data Visualization': [['Best chart for trend over time?', ['Line chart', 'Pie chart', 'Venn diagram', 'Table'], 0], ['Too many colours cause...', ['Clarity', 'Visual clutter', 'Faster loading', 'Accuracy'], 1], ['A heatmap encodes values as...', ['Colour intensity', 'Fonts', 'Sounds', 'Angles'], 0]],
            'Research Methodology': [['A hypothesis is...', ['A testable statement', 'A conclusion', 'A dataset', 'A citation'], 0], ['Sampling bias affects...', ['Representativeness', 'Font size', 'Speed', 'Cost only'], 0], ['A control group is used to...', ['Compare outcomes', 'Save money', 'Skip ethics', 'Add variables'], 0]]
        };
        const tgt = c => c.target || { Beginner: 3, Intermediate: 4, Advanced: 5 }[c.df];
        const mods = c => c.mods || ['Introduction', 'Fundamentals', 'Practical Applications'];
        const qs = c => c.qs || Q[c.sk] || Q.Python;
        const pr = (c, e) => e ? Math.round((e.done.length + (e.passed ? 1 : 0)) / (mods(c).length + 1) * 100) : 0;
        const all = S => C.concat(S.custom), vis = S => all(S).filter(c => S.pub[c.id] !== false), byId = (S, id) => all(S).find(c => c.id == id);
        const gp = S => Object.keys(S.req).map(k => ({ k, c: S.cur[k] || 1, r: S.req[k], g: S.req[k] - (S.cur[k] || 1) })).sort((a, b) => b.g - a.g);
        const st = g => g <= 0 ? ['Strong', 'ok'] : g == 1 ? ['Skill Gap', 'wa'] : ['Critical Gap', 'er'];
        const rec = S => gp(S).filter(x => x.g > 0).map(x => { const c = vis(S).filter(c => c.sk == x.k && tgt(c) > x.c && !(S.enr[c.id] && S.enr[c.id].passed)).sort((a, b) => tgt(a) - tgt(b))[0]; return c && { c, x, why: `Recommended because your ${x.k} competency is ${x.c}/5 and your role requires ${x.r}/5.` } }).filter(Boolean);
        const N = (s, ...t) => t.map(x => ({ t: x, r: 0 })).concat(s.notifs);
        const enroll = (A, c) => { A.set(s => ({ enr: { ...s.enr, [c.id]: { done: [], passed: false } }, notifs: N(s, 'You enrolled in ' + c.t) })); A.T('Enrolled in ' + c.t) };
        const S0 = {
            view: 'landing', role: null, page: 'dashboard', cid: null, nopen: 0,
            user: { name: 'Rahul Sharma', org: 'National Research Institute', dept: 'Research', desig: 'Scientist B', exp: 6, edu: 'M.Tech, Computer Science, IIT Kanpur (2018)' },
            cur: { Python: 4, 'Data Analysis': 3, 'Machine Learning': 2, 'Cloud Computing': 3, 'Data Visualization': 2, 'Research Methodology': 3 },
            req: { Python: 4, 'Data Analysis': 4, 'Machine Learning': 4, 'Cloud Computing': 4, 'Data Visualization': 3, 'Research Methodology': 3 },
            enr: {}, hist: [], custom: [], pub: {}, off: {},
            notifs: [{ t: 'New course available: Advanced Machine Learning', r: 0 }, { t: 'Your assessment deadline is tomorrow.', r: 0 }, { t: 'Your competency profile has been updated.', r: 1 }]
        };
        const Cd = ({ t, children }) => html`<section class="cd">${t && html`<h3>${t}</h3>`}${children}</section>`;
        const Bar = ({ v, m = 5, col }) => html`<div class="bar"><i style=${{ width: Math.min(100, v / m * 100) + '%', background: col || 'var(--p2)' }}/></div>`;
        const Ch = ({ t, d, m = 100, u = '%' }) => html`<${Cd} t=${t}>${d.map(([l, v]) => html`<div class="cr" key=${l}><span>${l}</span><${Bar} v=${v} m=${m}/><b>${v}${u}</b></div>`)}<//>`;
        const Stat = ({ l, v }) => html`<div class="cd"><div class="mu">${l}</div><h2>${v}</h2></div>`;
        const Empty = ({ m }) => html`<p class="mu">${m}</p>`;

        const Dash = A => {
            const { S, go } = A, g = gp(S), R = rec(S), ids = Object.keys(S.enr);
            const avg = (g.reduce((a, x) => a + x.c, 0) / g.length).toFixed(1), lp = ids.length ? Math.round(ids.reduce((a, i) => a + pr(byId(S, i), S.enr[i]), 0) / ids.length) : 0;
            return html`<div><h2>Welcome, ${S.user.name}</h2><div class="g">
<${Stat} l="Overall Competency" v=${avg + ' / 5'}/><${Stat} l="Learning Progress" v=${lp + '%'}/><${Stat} l="Active Courses" v=${ids.filter(i => !S.enr[i].passed).length}/>
<${Stat} l="Certificates" v=${ids.filter(i => S.enr[i].passed).length}/><${Stat} l="Skill Gaps" v=${g.filter(x => x.g > 0).length}/></div>
<${Cd} t="My Recommended Courses">${R.length ? R.slice(0, 3).map(({ c, why }) => html`<div key=${c.id} class="row sp" style=${{ margin: '8px 0' }}><div><b>${c.t}</b><div class="mu">${why}</div></div><button class="b s" onClick=${() => go('course', c.id)}>View course</button></div>`) : html`<${Empty} m="No skill gaps identified. You meet every required level."/>`}<//>
<div class="g"><${Ch} t="My Competencies (of 5)" d=${g.map(x => [x.k, x.c])} m=${5} u="/5"/>
<${Cd} t="Competency Timeline">${S.hist.length ? S.hist.map((x, i) => html`<p key=${i}>${x.sk}: <b>${x.f} → ${x.t}</b> <span class="mu">(${x.sc}% on ${x.d})</span></p>`) : html`<${Empty} m="No competency updates yet. Complete an assessment to see changes."/>`}<//></div></div>`
        };

        const Prof = A => {
            const { S, set, T } = A; const [f, sf] = useState(S.user), [ed, se] = useState(0);
            if (S.role == 'trainer') { const t = TR[0]; return html`<${Cd} t=${t.n}><p>${t.o} · ${t.y} years experience · ⭐ ${t.r}</p>${t.ex.map((x, i) => html`<div class="cr" key=${x}><span>${x}</span><${Bar} v=${5 - Math.min(i, 1)} m=${5}/><b>${i ? 'Advanced' : 'Expert'}</b></div>`)}<//>` }
            const F = [['name', 'Name'], ['org', 'Organization'], ['dept', 'Department'], ['desig', 'Designation'], ['exp', 'Experience (years)'], ['edu', 'Education']];
            const done = Object.values(S.enr).filter(e => e.passed).length;
            return html`<div><${Cd} t="Profile">${F.map(([k, l]) => html`<label key=${k}>${l}${ed ? html`<input value=${f[k]} onInput=${e => sf({ ...f, [k]: e.target.value })}/>` : html`<div><b>${S.user[k]}</b></div>`}</label>`)}
${ed ? html`<button class="b" onClick=${() => { set({ user: f }); se(0); T('Profile saved') }}>Save</button>` : html`<button class="b o" onClick=${() => se(1)}>Edit profile</button>`}<//>
<${Ch} t="Competencies" d=${gp(S).map(x => [x.k, x.c])} m=${5} u="/5"/>
<${Cd} t="Certifications"><p>AWS Cloud Practitioner (2023)</p>${Object.keys(S.enr).filter(i => S.enr[i].passed).map(i => html`<p key=${i}>${byId(S, i).t} <span class="mu">(${S.enr[i].cert.id})</span></p>`)}<//></div>`
        };

        const Skills = A => html`<div><${Ch} t="My Skills & Competency Levels" d=${gp(A.S).map(x => [x.k, x.c])} m=${5} u="/5"/>
<${Cd} t="Competency Timeline">${A.S.hist.length ? A.S.hist.map((x, i) => html`<p key=${i}>Your ${x.sk} competency improved from ${x.f} → ${x.t}.</p>`) : html`<${Empty} m="No updates yet."/>`}<//></div>`;

        const Path = ({ S, go }) => {
            const g = gp(S)[0]; if (!g || g.g <= 0) return html`<${Empty} m="No skill gaps identified."/>`;
            const cs = vis(S).filter(c => c.sk == g.k && tgt(c) > g.c).sort((a, b) => tgt(a) - tgt(b));
            return html`<${Cd} t=${'Recommended Learning Path: ' + g.k}>${cs.map(c => html`<div key=${c.id}><div class="step" onClick=${() => go('course', c.id)}>${c.t} ${S.enr[c.id] && S.enr[c.id].passed ? '✓' : ''}</div><div class="ar">↓</div></div>`)}<div class="step">Assessment</div><div class="ar">↓</div><div class="step">Competency Update</div><//>`
        };
        const Gap = A => {
            const { S, go } = A, g = gp(S), tot = g.reduce((a, x) => a + Math.max(0, x.g), 0), mx = g.reduce((a, x) => a + x.r - 1, 0) || 1;
            return html`<div><h2>Skill Gap Analysis</h2><div class="g"><${Stat} l="Skill Gap Score (0 = none)" v=${Math.round(tot / mx * 100)}/><${Stat} l="Critical gaps" v=${g.filter(x => x.g >= 2).length}/><${Stat} l="Strengths" v=${g.filter(x => x.g <= 0).length}/></div>
${g.map(x => {
                const [s, c] = st(x.g); return html`<${Cd} key=${x.k}><div class="row sp"><b>${x.k}</b><span class=${'bd ' + c}>${s}</span></div>
<div class="cr"><span>Current ${x.c}/5</span><${Bar} v=${x.c} m=${5}/></div><div class="cr"><span>Required ${x.r}/5</span><${Bar} v=${x.r} m=${5} col="var(--ok)"/></div><//>`
            })}
<${Path} S=${S} go=${go}/></div>`
        };

        const CCard = ({ A, c, rc }) => {
            const { S, go } = A, e = S.enr[c.id]; return html`<div class="cd"><div class="row sp"><span class="bd">${c.df}</span>${rc && html`<span class="bd ok">Recommended</span>`}</div><h3>${c.t}</h3><p class="mu">${c.d}</p><p>👨‍🏫 ${TR[c.tr].n}<br/>⏱ ${c.du} weeks · 🎯 ${c.sk}</p>
${e ? html`<${Bar} v=${pr(c, e)} m=${100}/>` : null}<div class="row"><button class="b s" onClick=${() => go('course', c.id)}>${e ? (e.passed ? 'Completed ✓' : 'Continue (' + pr(c, e) + '%)') : 'View details'}</button>${!e && html`<button class="b o s" onClick=${() => enroll(A, c)}>Enroll</button>`}</div></div>`
        };
        const Cat = A => {
            const { S } = A; const [sk, ssk] = useState(''), [df, sdf] = useState(''), [du, sdu] = useState(''); const R = rec(S).map(r => r.c.id);
